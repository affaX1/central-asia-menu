  <div class="app" id="app">
    <!-- Главная -->
    <section class="screen" id="scr-home" data-screen="home" hidden></section>

    <!-- Меню -->

      <div class="mode-slot" id="mode-banner"></div>
      <header class="m-head">
        <h1 class="m-title" id="m-title"></h1>
        <div class="m-tools">
          <button type="button" class="round" id="search-btn" data-act="search-open"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
          <button type="button" class="round filter-btn" id="filter-btn" data-act="filters"></button>
        </div>
      </header>
      <div class="search-row" id="search-row" hidden>
        <label class="search">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" autocomplete="off" enterkeyhint="search">
          <button type="button" class="search-clear" id="search-clear"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </label>
      </div>
      <nav class="cats" id="cats"></nav>
      <main id="menu" tabindex="-1"></main>
      <footer class="foot" id="foot"></footer>
    </section>

    <!-- Заказы -->
    <section class="screen" id="scr-orders" data-screen="orders" hidden></section>
    <!-- Профиль -->
    <section class="screen" id="scr-profile" data-screen="profile" hidden></section>
    <!-- Бронь стола -->
    <section class="screen sub" id="scr-booking" data-screen="booking" hidden></section>
    <!-- Доставка -->
    <section class="screen sub" id="scr-delivery" data-screen="delivery" hidden></section>
    <!-- Сканер QR -->
    <section class="screen sub" id="scr-scan" data-screen="scan" hidden></section>
    <!-- Где мой заказ -->
    <section class="screen sub" id="scr-track" data-screen="track" hidden></section>
  </div>

  <div class="dock" id="dock">
    <div class="table-actions" id="table-actions" hidden></div>
    <button class="order-bar" id="order-bar" type="button" hidden></button>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
    <div class="sheet-grab" aria-hidden="true"></div>
    <button class="sheet-close" id="sheet-close" type="button"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div id="sheet-body"></div>
  </section>
