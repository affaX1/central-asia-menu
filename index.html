<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menu</title>
  <meta name="description" content="Электронное меню ресторана">
  <meta name="theme-color" content="#FAF5EC">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <script>
    try {
      var t = localStorage.getItem('menu:theme');
      t = t ? JSON.parse(t) : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
  <!-- Иконки: одна линейная коллекция для всего сайта -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5s1.2-6.1 3.5-8.5z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 20.5s-6.5-5.7-6.5-11a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11-6.5 11z"/><circle cx="12" cy="9.5" r="2.3"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6 3.8h3l1.5 4.2-1.9 1.3a10.5 10.5 0 0 0 6.1 6.1l1.3-1.9 4.2 1.5v3a2 2 0 0 1-2.2 2A15.8 15.8 0 0 1 4 6a2 2 0 0 1 2-2.2z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12.5h9.2l.9-12.5M10 11v5M14 11v5"/></symbol>
      <symbol id="i-table" viewBox="0 0 24 24"><path d="M3.5 9h17M5.5 9l1.5-3.5h10L18.5 9M6.5 9v10M17.5 9v10M6.5 14h11"/></symbol>
      <symbol id="i-dish" viewBox="0 0 24 24"><path d="M3.5 18.5h17M5.5 18.5a6.5 6.5 0 0 1 13 0M12 12v-.5M10.6 10.2h2.8"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.2M12 16.2v.1"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5h4"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-2.75-1.8L12 20.5l-2.75-1.8L6.5 20.5zM9.5 8.5h5M9.5 12h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></symbol>
    </defs>
  </svg>

  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="logo" id="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <h1 id="r-name"></h1>
          <p id="r-tagline"></p>
        </div>
      </div>
      <div class="hero-actions">
        <button id="lang-btn" class="pill" type="button"></button>
        <button id="theme-btn" class="icon-btn" type="button"></button>
      </div>
    </div>
    <div class="info" id="r-info"></div>
    <div class="table-actions" id="table-actions" hidden></div>
    <label class="search">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" enterkeyhint="search">
      <button type="button" class="search-clear" id="search-clear" hidden><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </label>
  </header>

  <nav class="cats" id="cats"></nav>

  <main id="menu" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>

  <button class="order-bar" id="order-bar" type="button" hidden></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
    <button class="sheet-close" id="sheet-close" type="button"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div id="sheet-body"></div>
  </section>

  <script src="config.js?v=18"></script>
  <script src="data.js?v=18"></script>
  <script src="schedule.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
